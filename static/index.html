<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fzf</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>fzf</h1>

    <section aria-labelledby="query-heading">
      <h2 id="query-heading">Query</h2>
      <form id="filter-form">
        <label for="query">Query</label>
        <input
          type="search"
          id="query"
          name="query"
          autocomplete="off"
          aria-describedby="query-help"
          accesskey="q"
        />
      </form>
      <p id="query-help" class="visually-hidden">
        Extended fzf search syntax. Results update as you type.
      </p>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <section aria-labelledby="matches-heading">
      <fieldset>
        <legend><h2 id="matches-heading">Matches</h2></legend>
        <ul id="matches" tabindex="-1"></ul>
      </fieldset>
    </section>

    <section aria-labelledby="actions-heading">
      <h2 id="actions-heading">Actions</h2>
      <div id="bulk-actions">
        <button type="button" id="btn-select-all" accesskey="a">
          Select all matching
        </button>
        <button type="button" id="btn-toggle-all" accesskey="t">
          Toggle all matching
        </button>
        <button type="button" id="btn-deselect-all" accesskey="d">
          Deselect all
        </button>
      </div>
    </section>

    <section aria-labelledby="selected-heading">
      <h2 id="selected-heading">Selected</h2>
      <ul id="selected-list"></ul>
    </section>

    <section aria-labelledby="submit-heading">
      <h2 id="submit-heading">Push</h2>
      <form id="submit-form">
        <button type="submit" id="btn-push" accesskey="p">Push 0 items</button>
        <button type="button" id="btn-cancel" accesskey="x">Cancel</button>
      </form>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
